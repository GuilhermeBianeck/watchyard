name: Tests
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi uvicorn requests numpy opencv-python-headless psutil pytest httpx
      - run: pip install --no-deps -e .
      - run: pytest -q
